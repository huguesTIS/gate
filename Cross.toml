[target.x86_64-unknown-linux-gnu]
# libxkbcommon-dev: headers + pkg-config for linking the `xkbcommon` crate at build time.
# xkb-data: the actual keyboard-layout database (rules/symbols/*) `xkb_keymap_new_from_names`
# reads at runtime — needed because the same image doubles as our deployment container (see
# CLAUDE.md "Build environment"). See ARCHITECTURE_TECHNIQUE.md §10 for why: this is what lets
# the RDP Requester credential screen type the right character for *any* client keyboard layout
# (KLID -> xkb RMLVO), not just the hand-rolled QWERTY/AZERTY-FR tables it started with.
pre-build = ["apt-get update && apt-get install --assume-yes libz-dev libxkbcommon-dev xkb-data pkg-config"]

[build.env]
# Lets `OPENBAO_ADDR`/`OPENBAO_TOKEN`/`OPENBAO_MOUNT` reach `cargo test -- --ignored`
# inside the container when running warpgate-vault's live-OpenBao integration test —
# see its module docs. No-op unless those vars are actually set on the host.
#
# `WARPGATE_MSSQL_TEST`/`WARPGATE_MSSQL_TEST_ADDR` are the same pattern for
# warpgate-protocol-mssql's live-SQL-Server round-trip test — see its module docs.
#
# `WARPGATE_ACTIONS_SSH_TEST`/`WARPGATE_ACTIONS_WINRM_TEST` and their `_HOST`/
# `_PORT`/`_USER`/`_DOMAIN`/`_PASSWORD` companions are the same pattern for
# warpgate-actions's Tier 2 connector e2e tests — see connectors.rs's `e2e` module.
passthrough = [
    "OPENBAO_ADDR",
    "OPENBAO_TOKEN",
    "OPENBAO_MOUNT",
    "WARPGATE_MSSQL_TEST",
    "WARPGATE_MSSQL_TEST_ADDR",
    "WARPGATE_MSSQL_TEST_SA_PASSWORD",
    "WARPGATE_ACTIONS_SSH_TEST",
    "WARPGATE_ACTIONS_SSH_HOST",
    "WARPGATE_ACTIONS_SSH_PORT",
    "WARPGATE_ACTIONS_SSH_ADMIN_PASSWORD",
    "WARPGATE_ACTIONS_WINRM_TEST",
    "WARPGATE_ACTIONS_WINRM_HOST",
    "WARPGATE_ACTIONS_WINRM_PORT",
    "WARPGATE_ACTIONS_WINRM_USER",
    "WARPGATE_ACTIONS_WINRM_DOMAIN",
    "WARPGATE_ACTIONS_WINRM_PASSWORD",
]
